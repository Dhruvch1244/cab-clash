<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13151b">
<meta name="description" content="Quick-fire mini-games for bored passengers. Two players, one phone, no internet needed.">
<title>Cab Clash</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%2313151b'/%3E%3Cpath d='M0 0h1v1H0zM2 0h1v1H2zM1 1h1v1H1zM3 1h1v1H3zM0 2h1v1H0zM2 2h1v1H2zM1 3h1v1H1zM3 3h1v1H3z' fill='%23f6c432'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: a taxi roof sign up top, then the mode ticket styled like a fare card. */
:root{
  --night:#13151b;
  --panel:#1c1f28;
  --ink:#f3efe4;
  --dim:#8a8f9e;
  --yellow:#f6c432;
  --line:#3a4050;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:19px;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.checker{height:12px;background:repeating-conic-gradient(var(--yellow) 0 25%,var(--night) 0 50%) 0 0/12px 12px;border-radius:2px}
.sign{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-block:10px 4px}
.sign small{font:700 14px var(--body);letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,16vw,76px);line-height:.95;margin:0;color:var(--yellow);letter-spacing:.01em}
.lede{font-size:20px;line-height:1.35;color:var(--ink);opacity:.85;max-width:30ch;margin:0;text-wrap:balance}
.modes{display:flex;flex-direction:column;gap:14px}
.mode{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:20px 18px;border-radius:18px;
  background:var(--panel);border:2px solid var(--line);color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.mode:hover,.mode:focus-visible{border-color:var(--c);outline:none;transform:translateY(-2px)}
.mode:active{transform:none}
.glyph{width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--night)}
.glyph svg{width:34px;height:34px}
.mode h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px;letter-spacing:.02em}
.mode p{margin:0;font-size:18px;line-height:1.25;color:var(--dim)}
.mode .go{font-family:var(--display);font-size:22px;color:var(--c)}
.solo{--c:var(--yellow)}
.teacher{align-self:center;color:var(--dim);font-size:16px}
@media (prefers-reduced-motion:reduce){.mode{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="checker" aria-hidden="true"></div>
  <header class="sign">
    <small>Back-seat mini-games</small>
    <h1>Cab Clash</h1>
    <p class="lede">Over 30 quick-fire games of reflex, maths, words and memory. Two players, one phone, no internet needed.</p>
  </header>
  <nav class="modes">
    <a class="mode solo" href="duel.html">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 12h12"/></svg></span>
      <span><h2>Play</h2><p>2 players. Lay the phone between you, each owns a half.</p></span>
      <span class="go" aria-hidden="true">›</span>
    </a>
  </nav>
  <div class="checker" aria-hidden="true"></div>
  <a class="teacher" href="admin.html">Teacher tracker</a>
</main>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</body>
</html>
